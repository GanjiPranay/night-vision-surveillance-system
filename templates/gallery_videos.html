{% extends "base.html" %}
{% block title %}Video Gallery — NV-SYS{% endblock %}
{% block content %}

<div class="topbar">
  <div class="topbar-left">
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost" id="btn-back-gallery-videos">← BACK</a>
    <h2>// SAVED VIDEOS</h2>
  </div>
  <span class="topbar-operator">{{ videos|length }} FILE(S)</span>
</div>

<div class="page-body">
  {% if videos %}
    <div class="gallery-grid">
      {% for vid in videos %}
        <div class="gallery-item" id="vid-{{ loop.index }}">
          <video controls preload="metadata">
            <source src="{{ url_for('static', filename='captures/videos/' ~ vid) }}" type="video/mp4">
          </video>
          <div class="gallery-meta">
            <span class="fname">{{ vid }}</span>
            <form method="POST"
                  action="{{ url_for('delete_video_route', filename=vid) }}"
                  onsubmit="return confirm('Delete {{ vid }}?')">
              <button type="submit" class="btn-del" title="Delete" id="del-vid-{{ loop.index }}">✕</button>
            </form>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M10 9l5 3-5 3z"/>
      </svg>
      <p>NO VIDEOS RECORDED YET</p>
    </div>
  {% endif %}
</div>

{% endblock %}
