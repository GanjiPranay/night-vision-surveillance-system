{% extends "base.html" %}
{% block title %}Change PIN — NV-SYS{% endblock %}
{% block content %}

<div class="topbar">
  <div class="topbar-left">
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost" id="btn-back-change-pin">← BACK</a>
    <h2>// CHANGE PIN</h2>
  </div>
  <span class="topbar-operator">OPERATOR: {{ session.username }}</span>
</div>

<div class="center-screen">
  <div class="form-card">
    <div class="form-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" style="vertical-align:middle; margin-right:8px;">
        <rect x="5" y="11" width="14" height="9" rx="2"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
      </svg>
      Update Access PIN — {{ session.username }}
    </div>

    {% if message %}
      <div class="banner {{ message[0] }}">{{ message[1] }}</div>
    {% endif %}

    <form method="POST" id="form-change-pin">
      <div class="field-group">
        <label for="old_password">Current PIN</label>
        <input type="password"
               id="old_password"
               name="old_password"
               inputmode="numeric"
               pattern="[0-9]{4}"
               maxlength="4"
               placeholder="••••"
               autocomplete="current-password"
               required>
      </div>

      <div class="field-group">
        <label for="new_password">New PIN</label>
        <input type="password"
               id="new_password"
               name="new_password"
               inputmode="numeric"
               pattern="[0-9]{4}"
               maxlength="4"
               placeholder="••••"
               autocomplete="new-password"
               required>
      </div>

      <div class="field-group">
        <label for="confirm_password">Confirm New PIN</label>
        <input type="password"
               id="confirm_password"
               name="confirm_password"
               inputmode="numeric"
               pattern="[0-9]{4}"
               maxlength="4"
               placeholder="••••"
               autocomplete="new-password"
               required>
      </div>

      <div class="footer-actions" style="max-width:100%;">
        <button type="submit" class="btn btn-primary" id="btn-update-pin">UPDATE PIN</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-ghost" id="btn-cancel-pin">CANCEL</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
