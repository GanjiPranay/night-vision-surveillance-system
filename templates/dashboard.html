{% extends "base.html" %}
{% block title %}Main Menu — NV-SYS{% endblock %}
{% block content %}

<div class="topbar">
  <div class="topbar-left">
    <span class="status-dot"></span>
    <h2>NV-SYS // MAIN MENU</h2>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="topbar-operator">OPERATOR: {{ session.username }}</span>
    <a href="{{ url_for('logout') }}"
       class="btn btn-round-icon"
       id="btn-logout"
       title="Log out">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="M16 17l5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
    </a>
  </div>
</div>

<div class="page-body">
  <div class="section-heading">Select Operation</div>

  <div class="dashboard-grid">

    <!-- (a) Capture Image -->
    <a class="tile" href="{{ url_for('capture_image_page') }}" id="tile-capture-image">
      <span class="tile-num">A</span>
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
      <span class="tile-label">Capture Image</span>
    </a>

    <!-- (b) Capture Video -->
    <a class="tile" href="{{ url_for('capture_video_page') }}" id="tile-capture-video">
      <span class="tile-num">B</span>
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="6" width="12" height="12" rx="2"/>
        <path d="M15 10l6-3v10l-6-3z"/>
      </svg>
      <span class="tile-label">Capture Video</span>
    </a>

    <!-- (c) Saved Images -->
    <a class="tile" href="{{ url_for('gallery_images') }}" id="tile-gallery-images">
      <span class="tile-num">C</span>
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9.5" r="1.5"/>
        <path d="M21 16l-5.5-5.5L9 17"/>
      </svg>
      <span class="tile-label">View Images</span>
    </a>

    <!-- (d) Saved Videos -->
    <a class="tile" href="{{ url_for('gallery_videos') }}" id="tile-gallery-videos">
      <span class="tile-num">D</span>
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="tile-label">View Videos</span>
    </a>

    <!-- (e) Change PIN -->
    <a class="tile" href="{{ url_for('change_password_page') }}" id="tile-change-pin">
      <span class="tile-num">E</span>
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="5" y="11" width="14" height="9" rx="2"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
      </svg>
      <span class="tile-label">Change PIN</span>
    </a>

    <!-- (f) Settings -->
    <a class="tile" href="{{ url_for('settings_page') }}" id="tile-settings">
      <span class="tile-num">F</span>
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06
                 a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09
                 A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83
                 l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4
                 h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1
                 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0
                 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0
                 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21
                 a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/>
      </svg>
      <span class="tile-label">Settings</span>
    </a>

  </div>
</div>

{% endblock %}
